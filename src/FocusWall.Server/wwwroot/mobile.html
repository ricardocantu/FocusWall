<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover so the safe-area insets in mobile.css engage on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Claude Focus Wall — Mobile</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/usage.css">
  <link rel="stylesheet" href="/mobile.css">
</head>
<body class="mobile-page">
  <header class="m-top">
    <div class="brand"><span class="brand-dot"></span><span>Focus Wall</span></div>
    <div class="conn" id="conn">connecting…</div>
  </header>

  <!-- Glance banner: the loudest status across all sessions. Sticks to the top
       so the answer to "does Claude need me?" stays on screen while you scroll. -->
  <section class="m-summary" id="summary" data-status="idle">
    <div class="m-summary-word" id="summary-word">—</div>
    <div class="m-summary-sub" id="summary-sub"></div>
  </section>

  <!-- Snooze remote: the wall kiosk is cursorless, so the phone is where you
       silence the alert. Snooze suppresses the waiting pulse + Discord/Echo push
       for N minutes; events still log. -->
  <section class="m-snooze" id="snooze">
    <button type="button" class="m-snooze-btn" data-minutes="30">Snooze 30m</button>
    <button type="button" class="m-snooze-btn" data-minutes="60">1h</button>
    <button type="button" class="m-snooze-btn m-snooze-clear" data-minutes="0" hidden>Clear snooze</button>
  </section>

  <!-- Single-column session list. Cards reuse the grid's .card classes, so
       app.css styles + the waiting pulse apply unchanged. -->
  <section class="m-list" id="list"></section>

  <!-- Slack panel: reuses the shared slack.js module (same markup/IDs and
       polling as the hero's aside), just laid out full-width & stacked. -->
  <aside class="slack-panel m-slack" id="slack-panel" hidden>
    <div class="slack-panel-title">Slack</div>
    <div class="slack-accounts" id="slack-accounts"></div>
  </aside>

  <!-- Usage gauges: reuses usage.js unmodified (same #usage-accounts
       contract as hero.html/usage.html). -->
  <section class="m-usage">
    <div class="m-usage-title">Usage</div>
    <div class="usage-accounts" id="usage-accounts"></div>
  </section>

  <script src="/mobile.js" type="module"></script>
  <script src="/slack.js" type="module"></script>
  <script src="/usage.js" type="module"></script>
</body>
</html>
